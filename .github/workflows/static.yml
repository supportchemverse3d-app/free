name: Deploy CHEMVERSE to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the project zip, unzip and build
        run: |
          ZIP=""
          for f in project.zip $(find . -maxdepth 1 -type f ! -name '.*' | sed 's|^\./||'); do
            if [ -f "$f" ] && unzip -tq "$f" >/dev/null 2>&1 && unzip -l "$f" | grep -q "package.json"; then ZIP="$f"; break; fi
          done
          if [ -z "$ZIP" ]; then echo "ERROR: no project zip found in the repo root"; ls -la; exit 1; fi
          echo "Using zip: $ZIP"
          mkdir -p _app
          unzip -q "$ZIP" -d _app
          APP=$(dirname "$(find _app -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "App folder: $APP"
          cd "$APP"
          npm install --no-audit --no-fund
          npm run build
          cd "$GITHUB_WORKSPACE"
          mv "$APP/dist" ./dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
