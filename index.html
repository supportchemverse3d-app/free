<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" />
    <meta name="description" content="CHEMVERSE 3D molecular structures and Chemo AI" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080d16'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2354dfd1'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
    <title>CHEMVERSE — Structure + AI</title>
    <style>
      html, body { margin: 0; background: #080d16; color: #edf5f7; font-family: system-ui, sans-serif; }
      #boot { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; letter-spacing: .12em; font-weight: 800; }
      #boot small { display: block; margin-top: 10px; font-weight: 400; letter-spacing: 0; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">CHEM<span style="color:#54dfd1">VERSE</span><small>Loading…</small></div></div>
    <noscript><p style="padding:24px;text-align:center">Please enable JavaScript to use CHEMVERSE.</p></noscript>
    <script>
      // If the app script fails to load/run, show the reason instead of a blank page.
      window.addEventListener('error', function (e) {
        var b = document.getElementById('boot');
        if (b) b.innerHTML = 'CHEM<span style="color:#54dfd1">VERSE</span><small>Could not start: ' + String((e && e.message) || 'script failed to load').replace(/</g, '&lt;') + '</small>';
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
